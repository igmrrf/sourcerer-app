<div class="panel-head">
    <h2 class="panel-title">Repositories</h2>
    <span class="eyebrow">Indexed</span>
</div>

{{if not .}}
    <div class="empty">
        <p class="empty-title">No repositories analyzed yet</p>
        <p class="empty-hint">Repositories appear here as the worker finishes cloning and reading them.</p>
    </div>
{{else}}
    <ul class="rows rows--scroll">
        {{range .}}
        <li class="row">
            <div class="row-main">
                <span class="row-title">{{.Rehash}}</span>
                <span class="row-meta">
                    <span>{{.CommitCount}} commits</span>
                    <span class="is-add">+{{.LinesAdded}}</span>
                    <span class="is-del">&minus;{{.LinesDeleted}}</span>
                </span>
                <span class="microbar" aria-hidden="true">
                    <span class="is-add" style="width: {{pctOf .LinesAdded .LinesDeleted}}%"></span>
                    <span class="is-del" style="width: {{pctOf .LinesDeleted .LinesAdded}}%"></span>
                </span>
            </div>
            <div class="row-side">
                <a href="/r/{{.Rehash}}" class="btn btn--sm"
                   title="Contributor hall of fame for this repository">Hall of fame</a>
            </div>
        </li>
        {{end}}
    </ul>
{{end}}
