<h2>Overall Stats</h2>
{{if eq .TotalCommits 0}}
    <p class="empty-state">No commits ingested yet.</p>
{{else}}
    <div class="stats-hero">
        <p class="stat-value">{{.TotalCommits}}</p>
        <p class="stat-subtitle">Total Commits Analyzed</p>
    </div>
    
    <div class="stat-metrics-grid">
        <div class="metric-card added">
            <span class="metric-value">+{{.LinesAdded}}</span>
            <span class="metric-label">Lines Added</span>
        </div>
        <div class="metric-card deleted">
            <span class="metric-value">-{{.LinesDeleted}}</span>
            <span class="metric-label">Lines Deleted</span>
        </div>
    </div>
{{end}}
